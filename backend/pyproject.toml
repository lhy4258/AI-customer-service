[project]
name = "ai-portfolio-customer-service"
version = "0.1.0"
description = "项目1：电商 AI 客服 MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "openai>=1.40",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "slowapi>=0.1.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

